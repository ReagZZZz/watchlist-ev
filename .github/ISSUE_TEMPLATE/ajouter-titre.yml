name: Ajouter un titre à la watchlist
description: Tape juste le nom de l'entreprise. Le robot trouve le ticker, l'enveloppe et le secteur, l'ajoute et met les cours à jour.
title: "Ajouter"
labels: ["ajout-watchlist"]
body:
  - type: markdown
    attributes:
      value: |
        Tape le **nom de l'entreprise** (ex. « Hermès », « Microsoft », « Solana »). Tout le reste est facultatif : laisse « Auto » et le robot choisit.
        Il répond en commentaire avec le titre trouvé et les autres correspondances, puis ferme la demande (environ 1 minute).
  - type: input
    id: ticker
    attributes:
      label: Entreprise (nom ou ticker)
      placeholder: "ex. Hermès, Microsoft, Solana"
    validations:
      required: true
  - type: dropdown
    id: secteur
    attributes:
      label: Secteur
      options:
        - Auto
        - Luxe
        - Conso
        - Agro
        - Santé
        - Logiciels
        - Paiements
        - Semi-conducteurs
        - Big Tech
        - Défense & Aéro
        - Industrie
        - Énergie
        - Mobilité
        - Finance
        - Immobilier
        - Matières premières
        - ETF & couverture
        - Crypto
    validations:
      required: true
  - type: dropdown
    id: enveloppe
    attributes:
      label: Enveloppe
      options:
        - Auto
        - PEA
        - "PEA* (EEE, selon le courtier)"
        - CTO
        - AV
        - Crypto
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact sur mon patrimoine (0 = doublon, 10 = diversification idéale)
      options: ["5", "0", "1", "2", "3", "4", "6", "7", "8", "9", "10"]
    validations:
      required: true
  - type: input
    id: doublon
    attributes:
      label: Doublon avec mes lignes (optionnel)
      placeholder: "ex. Déjà détenu, poids lourd MSCI World, thème agro…"
  - type: textarea
    id: these
    attributes:
      label: Thèse en une phrase (optionnel, l'analyse du dimanche la complétera)
